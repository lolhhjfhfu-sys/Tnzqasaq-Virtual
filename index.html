            text-decoration: none;
            color: white;
            font-size: 17px;
            font-weight: bold;
            padding: 14px 30px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7b00ff, #c000ff);
            box-shadow:
                0 0 12px #9d00ff,
                0 0 30px #7200ff66;
            transition: 0.25s;
        }

        .download-btn:hover {
            transform: scale(1.06);
            box-shadow:
                0 0 20px #c000ff,
                0 0 45px #9d00ff;
        }

        .footer {
            margin-top: 40px;
            color: #80698f;
            font-size: 14px;
        }

        @media (max-width: 700px) {
